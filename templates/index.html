<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIT Student Query Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div class="app">
  <aside class="side" id="side">
    <h2>Suggested questions</h2>
    <div id="suggestions"></div>
  </aside>
  <main class="chat">
    <header>
      <button id="menuBtn" class="icon" aria-label="Suggested questions">&#9776;</button>
      <div><h1>Sample Institute of Technology</h1><p>AI Student Query Chatbot &middot; <span id="status">connecting&hellip;</span></p></div>
      <button id="clearBtn" class="ghost">Clear chat</button>
    </header>
    <div id="log" class="log" aria-live="polite"></div>
    <div class="notice">Demo college data is illustrative sample information. Always confirm with the college office.</div>
    <div class="composer">
      <input id="input" type="text" maxlength="500" placeholder="Ask about admissions, fees, hostel, placements..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
